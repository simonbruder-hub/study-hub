# Updates einmal im Monat, gesammelt in einem PR pro Bereich. Mergen, wenn die CI grün ist.
# Sicherheitsupdates kommen zusätzlich sofort, sobald sie in GitHub eingeschaltet sind
# (Settings, Code security, Dependabot security updates).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      npm:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
