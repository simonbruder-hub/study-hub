name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  inhalt:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Inhalte prüfen (Schema, Verweise, Kreise, Analogien, LaTeX, Schreibregeln)
        run: npm run inhalt
      - name: Tests der Prüfung
        run: npm test
