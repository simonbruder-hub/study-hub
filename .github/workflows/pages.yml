name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Inhalte prüfen
        run: npm run inhalt
      - name: App bauen (PWA)
        # Verbindung zur Ablage aus den GitHub-Variablen (Settings, Secrets and variables, Actions, Variables).
        # Der Publishable key ist absichtlich öffentlich; die Daten schützen die Regeln in supabase/schema.sql.
        # Ohne Variablen zeigt die Ablage «noch nicht verbunden».
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: npm run build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist/app
      - id: deployment
        uses: actions/deploy-pages@v5
